name: OrderWise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Migrate, Seed, Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: orderwise_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: orderwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://orderwise_user:password@localhost:5432/orderwise_test
        run: npm run migrate up

      - name: Seed Demo Data
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://orderwise_user:password@localhost:5432/orderwise_test
        run: npm run seed

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://orderwise_user:password@localhost:5432/orderwise_test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_64_characters_orderwise_2026_secure
          NODE_ENV: test
        run: npm test

  frontend-ci:
    name: Frontend CI (Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build
